{% extends "base.html" %}
{% block title %}Simulado — ENEM{% endblock %}

{% block content %}
<form method="POST" action="{{ url_for('finalizar_simulado') }}" id="exam-form" data-json-url="{{ url_for('simulado_json', id=simulado_id) }}">
    {# <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"> (se usar Flask-WTF) #}
    <input type="hidden" name="simulado_id" value="{{ simulado_id }}">
    <input type="hidden" name="tempo_segundos" id="elapsed" value="0">
    <div class="exam-header">
        <div>
            <span class="eyebrow" id="exam-meta">ENEM</span>
            <h1 id="exam-title">Carregando simulado...</h1>
        </div>
        <div class="exam-progress">
            <span><span id="timer" title="Tempo decorrido">00:00</span> · <span id="question-counter">0 / 0</span></span>
            <div class="mini-progress"><span id="question-progress"></span></div>
        </div>
    </div>

    <div class="exam-layout">
        <aside class="question-nav">
            <p class="eyebrow">QUESTÕES</p>
            <div class="question-grid" id="question-grid"></div>
        </aside>

        <main class="question-area" id="question-area">

            <p class="small muted redacao-hint">Redação: escreva e corrija na <a href="{{ redacao_url }}" target="_blank" rel="noopener">plataforma externa ↗</a>.</p>
            <div class="question-actions">
                <button type="button" class="button button-secondary" id="previous-question" disabled>Anterior</button>
                <button type="button" class="button button-primary" id="next-question">Próxima <span>→</span></button>
                <button type="submit" class="button button-primary hidden" id="finish-exam">Finalizar simulado</button>
            </div>
        </main>
    </div>
</form>
{% endblock %}

{% block scripts %}
<script>
    loadExam("{{ url_for('simulado_json', id=simulado_id) }}");
</script>
{% endblock %}
